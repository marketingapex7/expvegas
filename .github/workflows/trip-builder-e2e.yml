name: Trip builder smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint and typecheck run before the build so a type or lint regression
      # fails in seconds instead of after a full build and browser install.
      # typecheck must precede the build: tsconfig includes .next/types, so it
      # reads whatever the previous build left behind.
      - run: npm run lint
      - run: npm run typecheck
      # The unit suite covers the planning, scoring, and normalization logic in
      # about a second, so it runs before the browser install and build.
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
